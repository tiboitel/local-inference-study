<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Tested serving path and memory split</title>
  <desc id="desc">A client sends a cold long-context request to llama-server. On the GPU, resident expert weights, the KV cache, and compute buffers share 12 GB of VRAM. CPU-resident experts are streamed over PCIe during prompt processing. MTP adds a draft head on the GPU.</desc>
  <style>
    .box { fill: #f7f7f7; stroke: #333; stroke-width: 1.5; rx: 8; }
    .gpu { fill: #e8f1fb; stroke: #2b5d8a; }
    .cpu { fill: #eef7ea; stroke: #3d6b35; }
    .small { font: 13px sans-serif; fill: #222; }
    .label { font: 15px sans-serif; fill: #111; font-weight: 600; }
    .note { font: 12px sans-serif; fill: #555; }
    .arrow { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#444"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="150" width="150" height="90"/>
  <text class="label" x="95" y="180" text-anchor="middle">Client</text>
  <text class="small" x="95" y="202" text-anchor="middle">OpenAI-compatible</text>
  <text class="small" x="95" y="220" text-anchor="middle">chat request</text>

  <rect class="box" x="215" y="130" width="180" height="130"/>
  <text class="label" x="305" y="160" text-anchor="middle">llama-server</text>
  <text class="small" x="305" y="184" text-anchor="middle">stream: true</text>
  <text class="small" x="305" y="204" text-anchor="middle">cache_prompt: false</text>
  <text class="small" x="305" y="224" text-anchor="middle">unique nonce</text>
  <text class="small" x="305" y="244" text-anchor="middle">timings + peaks</text>

  <rect class="gpu box" x="440" y="30" width="430" height="250"/>
  <text class="label" x="655" y="58" text-anchor="middle">GPU — 12 GB VRAM (RTX 3060)</text>
  <rect class="box" x="460" y="78" width="180" height="62"/>
  <text class="small" x="550" y="104" text-anchor="middle">resident expert weights</text>
  <text class="note" x="550" y="124" text-anchor="middle">layers not offloaded</text>
  <rect class="box" x="660" y="78" width="190" height="62"/>
  <text class="small" x="755" y="104" text-anchor="middle">KV cache</text>
  <text class="note" x="755" y="124" text-anchor="middle">turbo4 / turbo3, 64k</text>
  <rect class="box" x="460" y="158" width="180" height="62"/>
  <text class="small" x="550" y="184" text-anchor="middle">compute buffers</text>
  <text class="note" x="550" y="204" text-anchor="middle">batch and attention</text>
  <rect class="box" x="660" y="158" width="190" height="62"/>
  <text class="small" x="755" y="184" text-anchor="middle">MTP draft head</text>
  <text class="note" x="755" y="204" text-anchor="middle">+ draft context</text>
  <text class="note" x="655" y="252" text-anchor="middle">measured peak with MTP on: 11,588 MiB; off: 10,595 MiB</text>

  <rect class="cpu box" x="440" y="320" width="430" height="80"/>
  <text class="label" x="655" y="348" text-anchor="middle">CPU — 32 GB host RAM</text>
  <text class="small" x="655" y="372" text-anchor="middle">cold expert weights for --n-cpu-moe 20</text>
  <text class="note" x="655" y="390" text-anchor="middle">streamed over PCIe during prompt processing</text>

  <path class="arrow" d="M170 195 L212 195"/>
  <path class="arrow" d="M395 195 L438 195"/>
  <path class="arrow" d="M555 318 L555 292"/>
  <path class="arrow" d="M710 318 L710 224"/>
</svg>
