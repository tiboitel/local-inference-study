name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Rebuild from the committed raw traces. If this changes a CSV, the
      # committed results were stale and the manifest check below fails.
      - name: Build results
        run: python scripts/build_results.py

      - name: Verify committed input/output hashes
        run: python scripts/manifest.py --check

      # Smoke test: the figures must render from the committed CSVs. Render into
      # a temporary directory so platform-specific PNG bytes do not disturb the
      # committed manifest; tests/test_artifacts.py checks the committed files.
      - name: Regenerate figures
        run: python scripts/make_figures.py --out "${RUNNER_TEMP}/figures"

      - name: Tests
        run: python -m pytest -q

      - name: Hygiene scan
        run: bash scripts/check_hygiene.sh

      - name: Traceability gate
        run: python scripts/check_traceability.py --report results/traceability.txt

      - name: Verify committed traceability report
        run: git diff --exit-code -- results/traceability.txt

      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-report
          path: results/traceability.txt

  documented-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the documented public workflow
        run: |
          python scripts/build_results.py --raw data/raw --out results
          python scripts/make_figures.py --out "${RUNNER_TEMP}/figures"
          python scripts/check_traceability.py --report results/traceability.txt
          python scripts/manifest.py --check
          python -m pytest -q
          bash scripts/check_hygiene.sh

      - name: Require no generated drift
        run: git diff --exit-code -- results data
